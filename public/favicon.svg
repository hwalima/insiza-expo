<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="5" fill="#111D02"/>
  <!-- Green base layer -->
  <rect width="32" height="32" rx="5" fill="#185909" opacity="0.35"/>
  <!-- Gold top accent bar -->
  <rect x="4" y="3" width="24" height="2.5" rx="1.25" fill="#D29500"/>
  <!-- Bold "IDI" — three vertical bars styled as a logo -->
  <!-- Left I -->
  <rect x="5" y="9" width="4" height="14" rx="2" fill="#D29500"/>
  <!-- Middle D shape (rect + right-curve feel) -->
  <rect x="12" y="9" width="4" height="14" rx="2" fill="#D29500"/>
  <rect x="12" y="9" width="7" height="3.5" rx="1.75" fill="#D29500"/>
  <rect x="12" y="19.5" width="7" height="3.5" rx="1.75" fill="#D29500"/>
  <!-- Right I -->
  <rect x="23" y="9" width="4" height="14" rx="2" fill="#D29500"/>
  <!-- Green bottom accent bar -->
  <rect x="4" y="26.5" width="24" height="2.5" rx="1.25" fill="#185909" opacity="0.8"/>
</svg>
